<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KCMS — Karate Club Management System</title>
  <desc id="desc">Primary vector logo featuring a karate practitioner, K emblem, enso brush circle and player management clipboard.</desc>

  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Transparent canvas -->

  <!-- Enso / brush circle -->
  <path d="M875 92 C1060 135 1115 305 1045 440"
        fill="none" stroke="#111827" stroke-width="28"
        stroke-linecap="round" opacity=".96"/>
  <path d="M1045 440 C970 575 760 605 625 490"
        fill="none" stroke="url(#red)" stroke-width="30"
        stroke-linecap="round"/>
  <path d="M625 490 C515 395 530 205 665 125"
        fill="none" stroke="#111827" stroke-width="26"
        stroke-linecap="round"/>
  <path d="M665 125 C725 90 805 78 875 92"
        fill="none" stroke="url(#red)" stroke-width="26"
        stroke-linecap="round"/>

  <!-- Stylized K behind athlete -->
  <path d="M655 135 L655 390 L745 300 L830 390 L760 390 L695 325 L695 470 L625 470 L625 135 Z"
        fill="url(#dark)"/>
  <path d="M735 135 L955 135 L890 205 L680 205 Z" fill="url(#red)"/>

  <!-- Karateka: head -->
  <circle cx="720" cy="238" r="29" fill="#111827"/>

  <!-- Karateka: torso / gi -->
  <path d="M685 270
           C650 285 620 330 612 380
           L590 485
           L690 505
           L730 420
           L770 505
           L875 485
           L838 370
           C824 318 790 284 755 270
           Z"
        fill="#fff" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>

  <!-- Gi lapels -->
  <path d="M700 278 L735 350 L765 278 L748 400 L720 430 L695 398 Z"
        fill="#e5e7eb" stroke="#111827" stroke-width="7"/>
  <path d="M735 350 L785 420 L748 435 L720 430 Z"
        fill="#f8fafc" stroke="#111827" stroke-width="7"/>

  <!-- Belt -->
  <path d="M665 400 Q730 425 810 398 L818 430 Q735 458 658 430 Z"
        fill="#111827"/>
  <path d="M744 425 L790 430 L782 520 L738 512 Z" fill="#111827"/>

  <!-- Rear arm -->
  <path d="M670 300 C625 310 575 350 540 392 L560 420
           C605 395 660 370 705 350 Z"
        fill="#fff" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>

  <!-- Punching arm -->
  <path d="M765 300 C830 300 885 318 940 350
           L925 390 C860 370 810 365 755 360 Z"
        fill="#fff" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>

  <!-- Fist -->
  <path d="M922 345 L970 350 L982 372 L968 400 L930 392 L916 370 Z"
        fill="#111827"/>

  <!-- Legs -->
  <path d="M670 430 L600 505 L490 590
           L530 630 L650 570 L735 495 Z"
        fill="#fff" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>
  <path d="M750 470 L820 545 L920 600 L895 645
           L775 585 L705 515 Z"
        fill="#fff" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>

  <!-- Feet -->
  <path d="M490 590 L530 630 L470 650 L425 630 Z" fill="#111827"/>
  <path d="M895 645 L920 600 L980 625 L990 650 L935 665 Z" fill="#111827"/>

  <!-- Clipboard / player management -->
  <g filter="url(#shadow)">
    <rect x="900" y="385" width="165" height="235" rx="18" fill="#fff" stroke="#111827" stroke-width="10"/>
    <rect x="955" y="365" width="55" height="38" rx="12" fill="#111827"/>
    <circle cx="945" cy="440" r="24" fill="#111827"/>
    <circle cx="945" cy="432" r="8" fill="#fff"/>
    <path d="M928 454 Q945 440 962 454" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <rect x="982" y="425" width="55" height="10" rx="5" fill="#111827"/>
    <rect x="982" y="447" width="42" height="9" rx="4.5" fill="#64748b"/>
    <rect x="925" y="490" width="112" height="10" rx="5" fill="#111827"/>
    <rect x="925" y="513" width="92" height="9" rx="4.5" fill="#64748b"/>
    <rect x="925" y="536" width="70" height="9" rx="4.5" fill="#64748b"/>
    <path d="M955 566 L975 580 L1005 548" fill="none" stroke="#ef233c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="735" font-size="150" font-weight="900" letter-spacing="-8" fill="#111827">
      <tspan fill="#ef233c">K</tspan>CMS
    </text>

    <line x1="180" y1="770" x2="270" y2="770" stroke="#ef233c" stroke-width="8"/>
    <line x1="930" y1="770" x2="1020" y2="770" stroke="#ef233c" stroke-width="8"/>

    <text x="600" y="780" font-size="30" font-weight="700" letter-spacing="8" fill="#111827">
      KARATE CLUB MANAGEMENT SYSTEM
    </text>

    <text x="600" y="835" font-size="25" font-weight="600" letter-spacing="5" fill="#475569">
      Manage <tspan fill="#ef233c">•</tspan> Track <tspan fill="#ef233c">•</tspan> Grow
    </text>
  </g>
</svg>
